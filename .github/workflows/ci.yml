name: CI

on:
  # On develop only: every push to it, and every pull request into it (Dependabot's). A develop → main pull request
  # is checked by develop's run on the same commit, and main isn't checked again after the merge: main requires
  # this check on an up-to-date branch, so what's merged is exactly what passed here.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # By hand, on any branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Pin Node rather than rely on the runner image's default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # `build` comes first, so every step after it checks what was just built.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      # DTCG validity (Terrazzo), naming and layering, WCAG contrast, chart palette, stylesheet,
      # published DTCG, brandTheme(), package contract and the stylesheet snapshot.
      - run: bun run test
      # publint + arethetypeswrong against the packed tarball consumers install.
      - run: bun run check:package
